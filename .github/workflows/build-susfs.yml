name: Build cezanne kernel (official KSU v0.9.5 + SUSFS)

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: Kernel source repository (owner/name)
        required: true
        default: NCJFCQJ/android_kernel_xiaomi_mt6885
      kernel_branch:
        description: Kernel source branch
        required: true
        default: cgroup-v2
      defconfig:
        description: Defconfig
        required: true
        default: vendor/cezanne_user_defconfig
      ksu_tag:
        description: Official KernelSU tag
        required: true
        default: v0.9.5
      susfs_branch:
        description: susfs4ksu branch
        required: true
        default: kernel-4.14

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      KERNEL_REPO: ${{ inputs.kernel_repo }}
      KERNEL_BRANCH: ${{ inputs.kernel_branch }}
      DEFCONFIG: ${{ inputs.defconfig }}
      KSU_TAG: ${{ inputs.ksu_tag }}
      SUSFS_BRANCH: ${{ inputs.susfs_branch }}
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
    steps:
      - name: Checkout this repo (for patches/)
        uses: actions/checkout@v4
        with:
          path: self

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git ccache bc bison flex build-essential libssl-dev libelf-dev \
            zip curl lz4 lzop cpio device-tree-compiler python2 python3 \
            python-is-python3 zlib1g-dev

      - name: Clone kernel source
        run: git clone --depth=1 -b "$KERNEL_BRANCH" "https://github.com/$KERNEL_REPO" kernel

      - name: Download AOSP clang r487747c and GCC 4.9
        run: |
          base=https://android.googlesource.com/platform/prebuilts
          mkdir clang gcc64 gcc32
          curl -fsSL "$base/clang/host/linux-x86/+archive/refs/heads/android14-release/clang-r487747c.tar.gz" | tar -xz -C clang
          curl -fsSL "$base/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz" | tar -xz -C gcc64
          curl -fsSL "$base/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz" | tar -xz -C gcc32

      - name: Integrate official KernelSU
        working-directory: kernel
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/$KSU_TAG/kernel/setup.sh" | bash -s "$KSU_TAG"
          git -C KernelSU log -1 --oneline || true

      - name: Apply SUSFS patches
        working-directory: kernel
        run: |
          git clone --depth=1 -b "$SUSFS_BRANCH" https://gitlab.com/simonpunk/susfs4ksu.git ../susfs4ksu
          S=../susfs4ksu/kernel_patches
          cp -v "$S"/fs/* fs/ || true
          cp -v "$S"/include/linux/* include/linux/ || true
          cp -v "$S"/50_add_susfs_in_*.patch . || true
          cp -v "$S"/KernelSU/10_enable_susfs_for_ksu.patch KernelSU/ || true

          # --- KSU-side susfs patch (1 selinux.c hunk is fixed up manually) ---
          ( cd KernelSU && patch -p1 --no-backup-if-mismatch < 10_enable_susfs_for_ksu.patch ) \
            > ../ksu_patch.log 2>&1 || echo "KSU patch had rejects (expected: selinux.c)"
          if [ -f KernelSU/kernel/selinux/selinux.c.rej ]; then
            echo "[fixup] inserting susfs selinux block before DEVPTS_DOMAIN"
            if ! grep -q susfs_get_current_sid KernelSU/kernel/selinux/selinux.c; then
              awk -v B="$GITHUB_WORKSPACE/self/patches/selinux_susfs_block.c" '
                /^#define DEVPTS_DOMAIN/ && !done { while((getline l < B)>0) print l; print ""; done=1 }
                {print}
              ' KernelSU/kernel/selinux/selinux.c > /tmp/sx.c && mv /tmp/sx.c KernelSU/kernel/selinux/selinux.c
            fi
            grep -q susfs_get_current_sid KernelSU/kernel/selinux/selinux.c && echo "selinux fixup OK" || echo "selinux FIXUP FAILED"
            rm -f KernelSU/kernel/selinux/selinux.c.rej
          fi

          # this kernel uses atomic_long_t for cred->usage; fix KSU's injected get_cred_rcu
          if grep -q "atomic_inc_not_zero(&nonconst_cred->usage)" KernelSU/kernel/Makefile; then
            echo "[fixup] get_cred_rcu -> atomic_long_inc_not_zero"
            sed -i 's/atomic_inc_not_zero(&nonconst_cred->usage)/atomic_long_inc_not_zero(\&nonconst_cred->usage)/g' KernelSU/kernel/Makefile
          fi

          # --- kernel-side susfs patch (sys.c uname hunk fixed up manually) ---
          patch -p1 --no-backup-if-mismatch < 50_add_susfs_in_*.patch > ../susfs_patch.log 2>&1 \
            || echo "kernel patch had rejects (maybe sys.c)"
          if [ -f kernel/sys.c.rej ] && ! grep -q susfs_spoof_uname kernel/sys.c; then
            echo "[fixup] patching kernel/sys.c newuname manually"
            perl -0pi -e 's/(SYSCALL_DEFINE1\(newuname[^\n]*\n\{)/#ifdef CONFIG_KSU_SUSFS_SPOOF_UNAME\nextern void susfs_spoof_uname(struct new_utsname* tmp);\n#endif\n$1/' kernel/sys.c
            perl -0pi -e 's/(\tmemcpy\(&tmp, utsname\(\), sizeof\(tmp\)\);\n)/$1#ifdef CONFIG_KSU_SUSFS_SPOOF_UNAME\n\tsusfs_spoof_uname(&tmp);\n#endif\n/' kernel/sys.c
            grep -q susfs_spoof_uname kernel/sys.c && echo "sys.c fixup OK" || echo "sys.c FIXUP FAILED"
            rm -f kernel/sys.c.rej
          fi

          echo "== remaining .rej:"; find . -name '*.rej' | tee ../rejects.txt

      - name: Configure (SUSFS, kprobe hooks)
        working-directory: kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          M=(O=out ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1
             AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip
             CLANG_TRIPLE=aarch64-linux-gnu-
             CROSS_COMPILE="$GITHUB_WORKSPACE/gcc64/bin/aarch64-linux-android-"
             CROSS_COMPILE_ARM32="$GITHUB_WORKSPACE/gcc32/bin/arm-linux-androideabi-")
          make "${M[@]}" "$DEFCONFIG"
          scripts/config --file out/.config \
            -e CONFIG_KSU \
            -e CONFIG_KSU_SUSFS \
            -e CONFIG_KSU_SUSFS_SUS_PATH \
            -e CONFIG_KSU_SUSFS_SUS_MOUNT \
            -e CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT \
            -e CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT \
            -e CONFIG_KSU_SUSFS_SUS_KSTAT \
            -e CONFIG_KSU_SUSFS_TRY_UMOUNT \
            -e CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT \
            -e CONFIG_KSU_SUSFS_SPOOF_UNAME \
            -e CONFIG_KSU_SUSFS_ENABLE_LOG \
            -e CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            -e CONFIG_KSU_SUSFS_SPOOF_BOOTCONFIG \
            -e CONFIG_KSU_SUSFS_OPEN_REDIRECT
          make "${M[@]}" olddefconfig
          echo "== effective KSU/SUSFS config:"; grep -E "CONFIG_KSU" out/.config || true

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: cezanne-ksu095-${{ inputs.kernel_branch }}
          max-size: 2G

      - name: Build kernel
        working-directory: kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export KBUILD_BUILD_USER=github KBUILD_BUILD_HOST=actions
          M=(O=out ARCH=arm64 CC="ccache clang" LD=ld.lld LLVM=1 LLVM_IAS=1
             AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip
             CLANG_TRIPLE=aarch64-linux-gnu-
             CROSS_COMPILE="$GITHUB_WORKSPACE/gcc64/bin/aarch64-linux-android-"
             CROSS_COMPILE_ARM32="$GITHUB_WORKSPACE/gcc32/bin/arm-linux-androideabi-")
          set -o pipefail
          make -j"$(nproc)" "${M[@]}" 2>&1 | tee build.log
          ls -la out/arch/arm64/boot/

      - name: Collect output
        if: always()
        working-directory: kernel
        run: |
          D="$GITHUB_WORKSPACE/artifact"; mkdir -p "$D"
          cp -v out/arch/arm64/boot/Image* "$D/" 2>/dev/null || true
          cp -v out/.config "$D/kernel.config" 2>/dev/null || true
          tail -n 400 build.log > "$D/build-tail.log" 2>/dev/null || true
          cp -v ../susfs_patch.log ../ksu_patch.log ../rejects.txt "$D/" 2>/dev/null || true
          find . -name '*.rej' -exec cp --parents -v {} "$D/" \; 2>/dev/null || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cezanne-ksu095-${{ github.run_number }}
          path: artifact/
